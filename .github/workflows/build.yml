name: Build ZMK firmware

on:
  push:
    paths:
      - "config/**"
      - "boards/**"
      - "src/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "build.yaml"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "config/**"
      - "boards/**"
      - "src/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "build.yaml"
      - ".github/workflows/build.yml"

  workflow_dispatch:

jobs:
  build:
    uses: cormoran/zmk/.github/workflows/build-user-config.yml@main+dya
